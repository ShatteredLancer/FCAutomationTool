name: Publish immutable release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v27.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Verify exact read-only release approval and installation evidence
        run: node scripts/check-release-readiness.mjs
      - name: Verify committed compatibility userscript
        run: git diff --exit-code -- FCAutomationTool.user.js
      - run: node scripts/verify-fc27-prelaunch.mjs
      - run: node scripts/check-release-readiness.mjs --packaging

      - name: Validate release tag
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG.Trim() } else { $env:REF_NAME.Trim() }
          if ($tag -ne "v$version") {
            throw "Release tag $tag does not match package version $version"
          }
          git rev-parse --verify "$tag^{commit}" | Out-Null
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$tag" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8

      - name: Validate stable and preview channel isolation
        id: channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $releases = gh release list --limit 100 --json tagName,isLatest | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify current latest release' }
          $latest = @($releases | Where-Object { $_.isLatest })
          if ($latest.Count -gt 1) { throw 'Ambiguous latest release' }
          if ($latest.Count -eq 0 -and @($releases).Count -gt 0) { throw 'Latest release not found in bounded listing' }
          $latestTag = if ($latest.Count -eq 1) { $latest[0].tagName } else { '' }
          $policy = node scripts/release-channel.mjs $env:RELEASE_VERSION $latestTag | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release channel is not approved' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "prerelease=$($policy.prerelease.ToString().ToLowerInvariant())" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "latest=$($policy.latest.ToString().ToLowerInvariant())" -Encoding utf8

      - name: Package release assets
        run: node scripts/package-fc27-release.mjs

      - name: Create or reuse draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft.Trim() -ne 'true') {
              throw "Release $env:RELEASE_TAG is already published and must remain immutable"
            }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --notes-file "docs/releases/$env:RELEASE_VERSION.md" --title "FC Automation Tool v$env:RELEASE_VERSION (Read-only)"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft release' }
          }

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $assets = @((Get-Content -LiteralPath 'dist/fc27-release-assets.json' | ConvertFrom-Json).assets | ForEach-Object { "dist/$_" })
          gh release upload $env:RELEASE_TAG $assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets' }

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          IS_PRERELEASE: ${{ steps.channel.outputs.prerelease }}
          MAKE_LATEST: ${{ steps.channel.outputs.latest }}
        run: |
          gh release edit $env:RELEASE_TAG --draft=false "--prerelease=$env:IS_PRERELEASE" "--latest=$env:MAKE_LATEST"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release' }

      - name: Write release summary
        shell: pwsh
        run: |
          $manifest = Get-Content 'FSU_mod\fsu-mod-manifest.json' | ConvertFrom-Json
          @"
          ## FC Automation Tool release

          | Field | Value |
          | --- | --- |
          | Runner | ``${{ steps.version.outputs.version }}`` |
          | Tag | ``${{ steps.version.outputs.tag }}`` |
          | FSU upstream | ``$($manifest.upstreamVersion)`` |
          | FSU Local | ``$($manifest.localVersion)`` |
          | Update metadata | ``FCAutomationTool.meta.js`` |
          | Checksums | ``SHA256SUMS`` |
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
